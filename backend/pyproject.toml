[build-system]
requires = ["hatchling>=1.22.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "hirepilot-backend"
version = "0.1.0"
description = "HirePilot AI — FastAPI backend with LangChain"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "python-dotenv>=1.0.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-google-genai>=4.2.1",
  "langchain-cerebras>=0.6.0",
  "sqlalchemy>=2.0.0",
  "greenlet>=3.0.0",
  "asyncpg>=0.30.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "chromadb>=0.6.0",
  "bcrypt>=4.0.0",
  "google-api-python-client>=2.100.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
